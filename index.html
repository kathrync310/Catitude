<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catitude Your Mood Your Cat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="script.js"></script>

    <div class="cat-image">
        <img id="catimage" src="images/cat.svg" alt="Cat Image">
    </div>

    <div class="hero">
        <img class="logo" src="images/catitude_logo.svg" alt="Catitude Logo" id="logo">
        <h1>Your Mood, Your Cat</h1>
    </div>

    <div class="content">

        <h1>Pick Your Mood</h1>

        <div class="mood-buttons">
            <button data-mood="happy">Happy</button>
            <button data-mood="sad">Sad</button>
            <button data-mood="disgusted">Disgusted</button>
            <button data-mood="angry">Angry</button>
            <button data-mood="tired">Sleepy</button>
            <button data-mood="calm">Calm</button>
            <button data-mood="crazy">Crazy</button>
            <button data-mood="surprised">Surprised</button>
        </div>

    </div>

    <main class="result-page" id="mood-result" hidden>
        <h1 id="result-heading">Your cat is waiting...</h1>
        <img id="result-photo" alt="" hidden>
        <p id="result-message" role="status">Loading your cat...</p>
        <a class="choose-again" href="#choose-mood">Choose another mood</a>
    </main>

</body>
</html>
